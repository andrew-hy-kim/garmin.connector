<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpolyline points='5,17 10,17 12.5,12 15.5,21 18.5,9 21,17 27,17' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Running">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
</head>
<body>
<main>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Running dashboard home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2a78d6"/><polyline points="5,17 10,17 12.5,12 15.5,21 18.5,9 21,17 27,17" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Running</a>
    <nav class="tabs" aria-label="Pages"><a href="index.html">Dashboard</a><a href="plan.html" aria-current="page">Training plan</a></nav>
    <div class="controls">
      <div class="seg" id="units" role="group" aria-label="Units"></div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </header>
  <h1 class="sr-only">Training plan</h1>

  <section class="card" id="setup" hidden>
    <h2>Pick a goal</h2>
    <p class="hint">The plan is built from your recent running time, how often you run, your fitness and form,
      any comeback from a break, your threshold HR and your recent best efforts. You can change it any time.</p>
    <form id="plan-form">
      <div class="goals" id="goals"></div>
      <div class="filters">
        <label>Weeks <select name="weeks"><option>4</option><option selected>6</option><option>8</option><option>12</option></select></label>
        <label>Runs per week <select name="runs_per_week"><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
        <label>Long run on <select name="long_day"><option value="Sun">Sunday</option><option value="Sat">Saturday</option></select></label>
        <button type="submit" class="primary">Create plan</button>
        <button type="button" id="cancel" hidden>Cancel</button>
      </div>
    </form>
  </section>

  <div id="plan" hidden>
    <section class="card">
      <div class="toolbar">
        <h2 style="margin:0" id="plan-title"></h2>
        <span class="spacer"></span>
        <button id="change" class="server-only">Change goal</button>
        <button id="remove" class="server-only">Remove plan</button>
      </div>
      <p class="hint" id="plan-sub"></p>
      <div id="plan-notes" class="notes"></div>
      <h2 style="margin-top:14px">Based on</h2>
      <div class="kv" id="based-on"></div>
      <h2>How to run it</h2>
      <ul id="guidance" style="margin:6px 0 0;padding-left:20px;color:var(--text-secondary);font-size:14px"></ul>
      <div class="ai-box" id="ai"></div>
    </section>
    <div id="weeks"></div>
  </div>
</main>

<script src="phone.js"></script>
<script src="common.js"></script>
<script src="plan.js"></script>
</body>
</html>
