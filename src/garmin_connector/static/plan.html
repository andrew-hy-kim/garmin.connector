<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpolyline points='5,17 10,17 12.5,12 15.5,21 18.5,9 21,17 27,17' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="loading">
<main>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Running dashboard home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2a78d6"/><polyline points="5,17 10,17 12.5,12 15.5,21 18.5,9 21,17 27,17" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Running</a>
    <nav class="tabs" aria-label="Pages"><a href="/"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Summary</span></a><a href="/plan" aria-current="page"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Training Plan</span></a></nav>
    <div class="controls">
      <div class="seg" id="units" role="group" aria-label="Units"></div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </header>
  <div class="page-head"><h1>Training Plan</h1></div>

  <section class="card" id="setup" hidden>
    <h2>Pick a goal</h2>
    <p class="hint">The plan is built from your recent running time, how often you run, your fitness and form,
      any comeback from a break, your threshold HR and your recent best efforts. You can change it any time.</p>
    <form id="plan-form">
      <div class="goals" id="goals"></div>
      <div class="filters">
        <label>Weeks <select name="weeks"><option>4</option><option selected>6</option><option>8</option><option>12</option></select></label>
        <label>Runs per week <select name="runs_per_week"><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
        <label>Long run on <select name="long_day"><option value="Sun">Sunday</option><option value="Sat">Saturday</option></select></label>
        <button type="submit" class="primary">Create plan</button>
        <button type="button" id="cancel" hidden>Cancel</button>
      </div>
    </form>
  </section>

  <div id="plan" hidden>
    <section class="card">
      <div class="toolbar">
        <h2 style="margin:0" id="plan-title"></h2>
        <span class="spacer"></span>
        <button id="ics" title="Download the remaining sessions as calendar events">Add to Calendar</button>
        <button id="change" class="server-only">Change goal</button>
        <button id="remove" class="server-only destructive">Remove plan</button>
      </div>
      <p class="hint" id="plan-sub"></p>
      <div id="plan-notes" class="notes"></div>
      <details class="more based"><summary>What this plan is based on</summary>
        <div class="kv" id="based-on"></div>
      </details>
      <h3 class="sub-h">How to run it</h3>
      <ul id="guidance" style="margin:6px 0 0;padding-left:20px;color:var(--text-secondary);font-size:14px"></ul>
      <div class="ai-box" id="ai"></div>
    </section>
    <div id="weeks"></div>
  </div>
</main>

<script src="/static/common.js"></script>
<script src="/static/plan.js"></script>
</body>
</html>
