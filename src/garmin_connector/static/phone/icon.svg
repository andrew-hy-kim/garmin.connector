<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#184f95"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- heart-rate trace -->
  <polyline points="72,282 168,282 204,206 252,350 300,150 340,282 440,282"
            fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rising bars: training building up -->
  <rect x="104" y="372" width="56" height="60" rx="10" fill="#9ec5f4"/>
  <rect x="228" y="352" width="56" height="80" rx="10" fill="#cde2fb"/>
  <rect x="352" y="328" width="56" height="104" rx="10" fill="#ffffff"/>
</svg>
