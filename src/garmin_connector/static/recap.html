<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Recap · Running</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpolyline points='5,17 10,17 12.5,12 15.5,21 18.5,9 21,17 27,17' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/leaflet.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="loading" data-page="recap">
<main>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Running dashboard home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2a78d6"/><polyline points="5,17 10,17 12.5,12 15.5,21 18.5,9 21,17 27,17" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Running</a>
    <nav class="tabs" aria-label="Pages"><a href="/" data-page="progress"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Progress</span></a><a href="/activities" data-page="activities"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor"/></svg><span>Activities</span></a><a href="/map" data-page="map"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.2-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Map</span></a><a href="/recap" data-page="recap"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0V4zM7 6H4.5a2.5 2.5 0 0 0 3 3.5M17 6h2.5a2.5 2.5 0 0 1-3 3.5M12 13v4M8.5 20h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Recap</span></a></nav>
    <div class="controls">
      <div class="seg" id="units" role="group" aria-label="Units"></div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </header>
  <div class="page-head"><div class="eyebrow" id="today">Every full year of your running</div><h1>Recap</h1></div>

  <section class="card welcome" id="recap-empty" hidden>
    <h2>No full years yet</h2>
    <p>A year gets its recap once it's over and your history covers all of it. Until then, Progress has your year so far.</p>
  </section>

  <section class="recap-totals" id="recap-totals"></section>
  <nav class="jump" id="recap-jump" aria-label="Years"></nav>
  <div id="recap-years"></div>
  <section class="card" id="recap-compare" hidden>
    <h2>Side by side</h2>
    <p class="hint">Highlighted: the best year in each column.</p>
    <div class="table-wrap"><table class="recap-table"><thead id="recap-compare-head"></thead><tbody id="recap-compare-rows"></tbody></table></div>
  </section>
  <p class="hint recap-foot" id="recap-foot"></p>

</main>

<script src="/static/common.js"></script>
<script src="/static/recap.js"></script>
</body>
</html>
