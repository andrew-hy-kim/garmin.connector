[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-connector"
version = "0.1.0"
description = "Pull your Garmin Connect activities into a local database and browse them in a dashboard."
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.3.2,<0.4",
    "keyring>=24",
    "fitdecode>=0.10",
    "flask>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fit-tool>=0.9.13"]

[project.scripts]
garmin-connector = "garmin_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garmin_connector = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
